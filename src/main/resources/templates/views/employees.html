<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4">
    <h3 class="mb-3 text-center">Quản Lý Nhân Viên</h3>

    <div class="mb-3">
        <a th:href="@{/employees/showNewEmployeeForm}" class="btn btn-outline-dark">Thêm Nhân viên mới</a>
    </div>

    <table class="table table-bordered text-center align-middle">
        <thead>
        <tr>
            <th>ID</th>
            <th>Tên Nhân Viên</th>
            <th>Email</th>
            <th>Lương</th>
            <th>Chức năng</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(employees)}">
            <td colspan="5">Chưa có dữ liệu nhân viên!</td>
        </tr>
        <tr th:each="emp : ${employees}">
            <td th:text="${emp.id}"></td>
            <td th:text="${emp.name}"></td>
            <td th:text="${emp.email}"></td>
            <td th:text="${#numbers.formatDecimal(emp.sallary, 0, 'COMMA', 0, 'POINT')}"></td>
            <td>
                <a th:href="@{/employees/showFormForUpdate/{id}(id=${emp.id})}" class="btn btn-outline-dark btn-sm">Update</a>
                <a th:href="@{/employees/delete/{id}(id=${emp.id})}"
                   class="btn btn-outline-dark btn-sm"
                   onclick="return confirm('Bạn có chắc muốn xóa nhân viên này?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
