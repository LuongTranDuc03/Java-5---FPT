<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body>
<div class="container my-4">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <h3 class="mb-4 text-center">Thêm Nhân viên mới</h3>

            <form th:action="@{/employees/saveEmployee}" th:object="${employee}" method="post"
                  class="border p-4 rounded" novalidate>

                <div class="mb-3">
                    <label class="form-label fw-bold">Name</label>
                    <input type="text" th:field="*{name}" class="form-control" placeholder="Nhập tên nhân viên"/>
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="text" th:field="*{email}" class="form-control" placeholder="Nhập email"/>
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Salary</label>
                    <input type="number" step="any" th:field="*{sallary}" class="form-control" placeholder="Nhập lương"/>
                    <div th:if="${#fields.hasErrors('sallary')}" th:errors="*{sallary}" class="error"></div>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-outline-dark px-4">Submit</button>
                    <a th:href="@{/employees}" class="btn btn-outline-dark px-4">Quay lại danh sách</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
